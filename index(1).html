/em></button><button data-pay="cash"><span class="method-icon cash-icon"></span><b>Наличные<small>Оплата наличными</small></b><em>›</em></button></div><div class="e-receipt"><b>ПОЛУЧЕНИЕ ЭЛЕКТРОННОГО ЧЕКА</b><small>Отправим чек на номер телефона или e-mail.</small><label class="${state.receiptTo==='phone'?'selected':''}"><input type="radio" name="rt" data-receipt="phone" ${state.receiptTo==='phone'?'checked':''}><span class="receipt-icon phone-icon"></span><b>Отправить на номер телефона</b><input id="receiptPhone" value="${state.receiptPhone}" placeholder="${phoneText()}"></label><em>или</em><label class="${state.receiptTo==='email'?'selected':''}"><input type="radio" name="rt" data-receipt="email" ${state.receiptTo==='email'?'checked':''}><span class="receipt-icon mail-icon"></span><b>Отправить на e-mail</b><input id="receiptEmail" value="${state.receiptEmail}" placeholder="Введите e-mail"></label></div></div></div>`}function success(){return `<div class="success"><div class="success-mark">✓</div><h1>Оплата прошла успешно!</h1><p>Спасибо, что выбираете СТРИЖЁМ</p><div class="qr-grid"><div><h3>Электронный чек</h3><span>Отсканируйте QR-код, чтобы получить чек</span><i class="fake-qr"></i><small>ⓘ Чек также отправлен на телефон или e-mail</small></div><div><h3>Чаевые мастеру</h3><span>Если вам всё понравилось, оставьте чаевые</span><i class="fake-qr alt"></i><small>♡ Спасибо за вашу поддержку!</small></div></div><div class="afterpay"><b>Покажите чек мастеру.</b><span>Спасибо за визит. Ждём вас снова.</span><b>★ Будем благодарны за отзыв!</b></div><button data-action="finish">ЗАВЕРШИТЬ →</button></div>`}function footer(){if(['home','success'].includes(state.screen))return '';let next='';if(state.screen==='extras')next=`<button ${state.entry==='extras'&&serviceCount()===0?'disabled':''} class="next" data-action="next-extras">ПРОДОЛЖИТЬ →</button>`;else if(state.screen==='phone')next=`<button class="next" data-action="next-phone">ПРОДОЛЖИТЬ →</button>`;else if(state.screen==='rating')next=`<button ${!state.master||!state.rating?'disabled':''} class="next" data-action="next-rating">ПРОДОЛЖИТЬ →</button>`;else next='<span class="footer-space"></span>';return `<footer class="footer"><button class="back" data-action="back"><span class="back-arrow">←</span><span class="back-label">НАЗАД</span></button>${steps()}${next}</footer>`}function modal(){if(!state.modal)return '';let body='';if(state.modal==='policy')body=`<h2>ПОЛЬЗОВАТЕЛЬСКОЕ СОГЛАШЕНИЕ</h2><div class="legal"><p>Нажимая «Согласен», вы даёте согласие на обработку номера телефона для участия в бонусной программе, получения информации о балансе и истории посещений.</p><p>Данные используются только для оказания услуг и не передаются третьим лицам без законного основания. Согласие можно отозвать, обратившись к администратору.</p></div><button class="modal-action" data-action="close-modal">СОГЛАСЕН</button>`;else if(state.modal==='pin')body=`<h2>СЕРВИСНЫЙ РЕЖИМ</h2><p>Введите PIN сотрудника</p><input class="promo-input" type="password" inputmode="numeric" placeholder="••••"><button class="modal-action" data-action="close-modal">ВОЙТИ</button>`;return `<div class="overlay"><div class="modal"><button class="modal-close" data-action="close-modal">×</button>${body}</div></div>`}function content(){return state.screen==='home'?home():state.screen==='haircuts'?haircutScreen():state.screen==='promos'?promos():state.screen==='extras'?extrasScreen():state.screen==='phone'?phoneScreen():state.screen==='source'?sourceScreen():state.screen==='rating'?ratingScreen():state.screen==='payment'?paymentScreen():success()}function render(){const s=state.scale||1;app.innerHTML=`<main class="stage"><div class="terminal-shell" style="width:${1024*s}px;height:${768*s}px"><section class="terminal screen-${state.screen}" style="transform:scale(${s})"><header class="topbar"><button class="brand" data-action="brand"><span class="brand-simple">✂ &nbsp;<b>СТРИЖЁМ</b><small>МУЖСКИЕ СТРИЖКИ</small></span></button></header><div class="content">${content()}</div>${footer()}${modal()}</section></div></main>`;}app.addEventListener('dblclick',e=>{if(e.target.closest('[data-action="brand"]')){state.modal='pin';render();}});app.addEventListener('click',e=>{const t=e.target;const a=t.closest('[data-action]')?.dataset.action;if(a==='haircuts'){state.screen='haircuts';render();return}if(a==='extras-home'){state.entry='extras';state.screen='extras';render();return}if(a==='promos'){state.screen='promos';render();return}if(a==='cosmetics'){alert('Раздел косметики будет подключён после загрузки каталога товаров');return}if(a==='upper-back'){goBackFromExtras();return}if(a==='policy'){state.modal='policy';render();return}if(a==='close-modal'){state.modal=null;render();return}if(a==='toggle-consent'){state.consentAccepted=!state.consentAccepted;render();return}if(a==='backspace'){state.phone=state.phone.slice(0,-1);render();return}if(a==='toggle-bonus'){state.useBonuses=!state.useBonuses;render();return}if(a==='next-extras'){if(state.entry!=='extras'||serviceCount()>0){state.screen='phone';render()}return}if(a==='next-phone'){nextPhoneScreen();return}if(a==='next-rating'){if(state.master&&state.rating){state.screen='payment';render()}return}if(a==='finish'){goHome();return}if(a==='back'){if(state.screen==='haircuts'||state.screen==='promos')state.screen='home';else if(state.screen==='extras')return goBackFromExtras();else if(state.screen==='phone')state.screen='extras';else if(state.screen==='source')state.screen='phone';else if(state.screen==='rating')state.screen='source';else state.screen='rating';render();return}const hc=t.closest('[data-haircut]');if(hc){state.base=haircuts.find(x=>x.id===hc.dataset.haircut);state.entry='haircut';render();setTimeout(()=>{state.screen='extras';render()},200);return}const pr=t.closest('[data-promo]');if(pr){state.base=pr.dataset.promo==='senior'?{id:'senior',name:'Пенсионер',price:400}:{id:'father-son',name:'Отец и сын',price:1400};state.entry='promo';state.screen='extras';render();return}const plus=t.closest('[data-plus]');if(plus){changeExtra(plus.dataset.plus,1);return}const minus=t.closest('[data-minus]');if(minus){changeExtra(minus.dataset.minus,-1);return}const card=t.closest('[data-extra-card]');if(card){const id=card.dataset.extraCard;if((state.selectedExtras[id]||0)===0)changeExtra(id,1);return}const digit=t.closest('[data-digit]');if(digit){if(state.phone.length<10)state.phone+=digit.dataset.digit;render();return}const src=t.closest('[data-source]');if(src){state.screen='rating';render();return}const m=t.closest('[data-master]');if(m){state.master=Number(m.dataset.master);render();return}const r=t.closest('[data-rating]');if(r){state.rating=Number(r.dataset.rating);render();return}const pay=t.closest('[data-pay]');if(pay){state.screen='success';render();return}const rec=t.closest('[data-receipt]');if(rec){state.receiptTo=rec.dataset.receipt;render();return}});app.addEventListener('input',e=>{if(e.target.id==='promoCode')state.promoCode=e.target.value.toUpperCase();if(e.target.id==='receiptPhone')state.receiptPhone=e.target.value;if(e.target.id==='receiptEmail')state.receiptEmail=e.target.value;});fit();</script></body></html>
